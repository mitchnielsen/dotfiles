# herdr configuration
# https://herdr.dev/docs/configuration

onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+b"
help = "prefix+?"
settings = "prefix+."
detach = "prefix+d"
reload_config = "prefix+r"
copy_mode = "prefix+["
edit_scrollback = ["cmd+e", "prefix+e", "prefix+ctrl+e"]

# Workspaces
workspace_picker = ["prefix+s", "cmd+o"]
goto = "prefix+ctrl+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+$"
previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"
switch_workspace = "prefix+shift+1..9"

# Tabs
new_tab = ["prefix+c", "cmd+t"]
rename_tab = "prefix+,"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = ["prefix+1..9", "cmd+1..9"]

# Panes
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = ["cmd+s", "prefix+v", "prefix+percent"]
split_horizontal = ["cmd+i", "prefix+minus", "prefix+double_quote"]
close_pane = ["prefix+x", "cmd+w"]
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "cmd+b"

[ui]
prompt_new_tab_name = true
prompt_new_workspace_name = true
agent_panel_sort = "spaces"
sidebar_collapsed_mode = "hidden"

tab_bar_right_separator = " · "
tab_bar_position = "top"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["workspace"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["workspace", "tab"],
  ["state_icon", "state_text", "agent"]
]

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
