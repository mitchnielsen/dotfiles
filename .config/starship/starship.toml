"$schema" = 'https://starship.rs/config-schema.json'

format = """
$fill
$directory$git_branch$git_status$git_state$python$kubernetes$aws$terraform$cmd_duration$jobs$direnv
$character
"""

docker_context = { disabled = true }
gcloud = { disabled = true }
golang = { disabled = true }
helm = { disabled = true }
hostname = { disabled = true }
nodejs = { disabled = true }
package = { disabled = true }
ruby = { disabled = true }
username = { disabled = true }

# palette = ""

[palettes.nord]
black = "#2E3440"
white = "#D8DEE9"
gray = "#4C566A"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
orange = "#D08770"
blue = "#81A1C1"
cyan = "#8FBCBB"
purple = "#B48EAD"
surface = "#3B4252"

[palettes.nordic]
black = "#191D24"
white = "#C0C8D8"
gray = "#60728A"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
orange = "#D08770"
blue = "#81A1C1"
cyan = "#8FBCBB"
purple = "#B48EAD"
surface = "#2E3440"

[fill]
disabled = true
symbol = '―'
style = '240'

[direnv]
disabled = false
format = " [$symbol$loaded]($style) "
loaded_msg = "loaded"

[jobs]
disabled = false
number_threshold = 1
symbol = '&'
style = 'yellow'
format = ' [$symbol$number]($style) '

[line_break]
disabled = false

[python]
disabled = false
python_binary = 'python3'
pyenv_version_name = true
symbol = ''
format = '[(${version} )(\($virtualenv\) )]($style)'

[kubernetes]
disabled = false
format = ' [☸ $context:$namespace](blue)'

[terraform]
disabled = false
format = '[tf:$workspace]($style) '

[aws]
disabled = false
format = ' [aws:$symbol($profile )(\($region\) )]($style)'
symbol = ''

[character]
disabled = false
success_symbol = '[\$](bold fg:green)'
error_symbol = '[\$](bold fg:red)'
vimcmd_symbol = '[@](bold fg:yellow)'

[directory]
truncate_to_repo = false
style = "bold fg:white"

[git_status]
format = '[[($all_status$ahead_behind )](fg:cyan)]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
style = "bg:surface"
stashed = "≡"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold"

[git_state]
format = '\([$state($progress_current/$progress_total)]($style)\)'
style = "red"
